name: 🐛 Bug Report
description: Report a problem with the Jellyfin Oscars Plugin
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug 🙌  
        Please fill out the following information so I can help you faster.

  - type: input
    id: plugin_version
    attributes:
      label: Plugin Version
      placeholder: e.g. 1.0.3
    validations:
      required: true

  - type: input
    id: jellyfin_version
    attributes:
      label: Jellyfin Version
      placeholder: e.g. 10.11.6
    validations:
      required: true

  - type: dropdown
    id: installation_method
    attributes:
      label: Installation Method
      options:
        - Docker
        - Windows
        - macOS
        - Linux (native)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue clearly
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click...
        3. See error...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs (if available)
      description: Paste relevant Jellyfin or plugin logs here
      render: shell
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Ubuntu 22.04 / Windows 11 / Synology DSM
    validations:
      required: false